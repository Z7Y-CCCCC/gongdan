name: CI 自动化门禁流水线

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  frontend-build:
    name: 前端编译与类型检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖与构建
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

  backend-build:
    name: 后端 Java 8 编译检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'maven'

      - name: Maven 编译与单测构建
        working-directory: ./backend
        run: |
          mvn clean test-compile
