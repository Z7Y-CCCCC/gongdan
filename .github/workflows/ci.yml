name: CI

on:
  push:
    branches:
      - master
      - "codex/**"
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
      - name: Test backend
        run: mvn -B test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Audit all frontend dependencies
        run: npm audit --audit-level=low --registry=https://registry.npmjs.org
      - name: Test frontend
        run: npm run test -- --reporter=dot
      - name: Test production plugin frame policy
        run: node --test scripts/test-plugin-csp.mjs
      - name: Build frontend
        run: npm run build
      - name: Validate frontend dependency tree after builds
        run: npm ls --all

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --include=optional
      - name: Test mobile regressions
        run: npm test
      - name: Audit all mobile dependencies
        run: npm audit --audit-level=low --registry=https://registry.npmjs.org
      - name: Build mobile H5
        run: npm run build
      - name: Build WeChat Mini Program
        run: npm run build:mp-weixin
      - name: Validate mobile dependency tree after builds
        run: npm ls --all

  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ops/mcp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ops/mcp/package-lock.json
      - run: npm ci
      - name: Validate MCP protocol
        run: npm test

  plugin-equipment-inspection:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/equipment-inspection
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
      - name: Test equipment inspection plugin
        run: mvn -B test

  plugin-quality-management:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/quality-management
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
      - name: Test quality management plugin
        run: mvn -B test

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Test external data deployment guards without services
        run: node --test ops/test-compose-config.test.mjs
      - name: Render docker compose config
        run: |
          cat > .env.ci <<'EOF'
          MYSQL_DATABASE=heihu_workorder
          MYSQL_USER=heihu_app
          MYSQL_PASSWORD=ci-db-password
          MYSQL_ROOT_PASSWORD=ci-root-password
          APP_SEED_FACTORY_CODE=HHGD
          APP_SEED_FACTORY_NAME=CI_Factory
          APP_SEED_ADMIN_USERNAME=admin
          APP_SEED_ADMIN_PASSWORD=ci-admin-password
          APP_SEED_ADMIN_NAME=CI_Admin
          APP_SEED_SUPER_ADMIN_USERNAME=admin
          APP_SEED_SUPER_ADMIN_PASSWORD=ci-super-admin-password
          APP_WECHAT_APP_ID=wx-ci-app
          APP_WECHAT_SECRET=ci-wechat-secret
          APP_PLUGIN_GATEWAY_SECRET=ci-plugin-gateway-secret-32-characters-long
          APP_SMS_SENDER=http
          APP_SMS_HTTP_URL=https://sms.example.invalid/send
          APP_CORS_ALLOWED_ORIGIN_PATTERNS=https://workorder.example.invalid
          APP_UPLOAD_STORAGE_TYPE=local
          FRONTEND_PORT=8080
          EOF
          docker compose --env-file .env.ci config --format json | node ops/test-compose-config.mjs --external-data-defaults
          SPRING_REDIS_PASSWORD='ci-redis-test-password' docker compose --env-file .env.ci config --format json | node ops/test-compose-config.mjs --external-data-defaults
      - name: Verify external data environment passthrough without starting containers
        env:
          # Public render-only fixtures, not usable production credentials or endpoints.
          APP_EXTERNAL_DATA_KEYS: "ci-render-only:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          APP_EXTERNAL_DATA_ACTIVE_KEY: ci-render-only
          APP_EXTERNAL_DATA_ALLOWED_TARGETS: "12@mes.example.invalid:443,12@plain.example.invalid:80"
          APP_EXTERNAL_DATA_ALLOWED_ADDRESSES: "12@192.0.2.12,12@192.0.2.13"
          APP_EXTERNAL_DATA_PLAINTEXT_TARGETS: "12@plain.example.invalid:80"
          APP_EXTERNAL_DATA_SQLITE_ROOT: /external-snapshots
          APP_EXTERNAL_DATA_SQLITE_FILES: "12@equipment_snapshot"
        run: docker compose --env-file .env.ci config --format json | node ops/test-compose-config.mjs --external-data-from-env

  ops-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate shell scripts
        run: |
          for script in ops/*.sh; do
            bash -n "$script"
          done
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem ops,deploy/windows/scripts -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error "$($_.Name): $($errors.Message -join '; ')"
            }
          }
          if ($failed) { exit 1 }
      - name: Test Windows operational guards
        shell: pwsh
        run: ./ops/test-windows-guards.ps1
