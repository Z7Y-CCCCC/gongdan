# H2 in-memory database for integration tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.cache.type=simple
logging.file.name=output/backend-tests.log
logging.logback.rollingpolicy.file-name-pattern=output/backend-tests.log.%d{yyyy-MM-dd}.%i

# App config for tests
app.binding.default-password-length=6
app.wechat.mock-enabled=true
app.wechat.app-id=
app.wechat.secret=
app.upload.report-image-dir=uploads/test-report-images
app.seed.factory-code=TEST
app.seed.factory-name=TestFactory
app.seed.admin-username=admin
app.seed.admin-password=123456
app.seed.admin-name=TestAdmin
app.seed.super-admin-factory-code=ADMIN
app.seed.super-admin-factory-name=SuperAdminFactory
app.seed.super-admin-username=admin
app.seed.super-admin-password=test-super-admin-pass
app.seed.super-admin-name=SuperAdmin
