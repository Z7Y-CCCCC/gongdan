server.port=${SERVER_PORT:18080}
server.address=${SERVER_ADDRESS:127.0.0.1}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/gongdan_demo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.format_sql=false
spring.flyway.enabled=false

app.wechat.mock-enabled=${APP_WECHAT_MOCK_ENABLED:true}
app.sms.sender=log
app.sms.log-code=true
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,http://192.168.*:*,http://10.*:*,http://172.*:*}
app.upload.storage-type=local
app.upload.report-image-dir=${APP_UPLOAD_REPORT_IMAGE_DIR:C:/www/gongdan/data/uploads}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
