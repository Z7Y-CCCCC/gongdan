server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

# 全局时区与日期时间格式（东八区 Asia/Shanghai）
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${SPRING_FLYWAY_BASELINE_VERSION:1}
spring.flyway.validate-on-migrate=${SPRING_FLYWAY_VALIDATE_ON_MIGRATE:true}

app.seed.factory-code=${APP_SEED_FACTORY_CODE}
app.seed.factory-name=${APP_SEED_FACTORY_NAME}
app.seed.admin-username=${APP_SEED_ADMIN_USERNAME}
app.seed.admin-password=${APP_SEED_ADMIN_PASSWORD}
app.seed.admin-name=${APP_SEED_ADMIN_NAME}
app.seed.super-admin-factory-code=${APP_SEED_SUPER_ADMIN_FACTORY_CODE:ADMIN}
app.seed.super-admin-factory-name=${APP_SEED_SUPER_ADMIN_FACTORY_NAME:\u8D85\u7EA7\u7BA1\u7406\u5458}
app.seed.super-admin-username=${APP_SEED_SUPER_ADMIN_USERNAME:admin}
app.seed.super-admin-password=${APP_SEED_SUPER_ADMIN_PASSWORD}
app.seed.super-admin-name=${APP_SEED_SUPER_ADMIN_NAME:\u8D85\u7EA7\u7BA1\u7406\u5458}

app.wechat.mock-enabled=false
app.wechat.app-id=${APP_WECHAT_APP_ID}
app.wechat.secret=${APP_WECHAT_SECRET}
app.wechat.openid-ticket-ttl-minutes=${APP_WECHAT_OPENID_TICKET_TTL_MINUTES:10}
app.sms.sender=${APP_SMS_SENDER:http}
app.sms.log-code=false
app.sms.http.url=${APP_SMS_HTTP_URL}
app.sms.http.auth-header-name=${APP_SMS_HTTP_AUTH_HEADER_NAME:}
app.sms.http.auth-header-value=${APP_SMS_HTTP_AUTH_HEADER_VALUE:}
app.sms.http.template=${APP_SMS_HTTP_TEMPLATE:login_code}
app.sms.http.connect-timeout-ms=${APP_SMS_HTTP_CONNECT_TIMEOUT_MS:3000}
app.sms.http.read-timeout-ms=${APP_SMS_HTTP_READ_TIMEOUT_MS:5000}
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS}
app.session.ttl-minutes=${APP_SESSION_TTL_MINUTES:720}
app.upload.storage-type=${APP_UPLOAD_STORAGE_TYPE:local}
app.upload.report-image-dir=${APP_UPLOAD_REPORT_IMAGE_DIR:/var/lib/heihu-workorder/report-images}
app.upload.s3.endpoint=${APP_UPLOAD_S3_ENDPOINT:}
app.upload.s3.region=${APP_UPLOAD_S3_REGION:us-east-1}
app.upload.s3.bucket=${APP_UPLOAD_S3_BUCKET:}
app.upload.s3.access-key=${APP_UPLOAD_S3_ACCESS_KEY:}
app.upload.s3.secret-key=${APP_UPLOAD_S3_SECRET_KEY:}
app.upload.s3.path-style-access=${APP_UPLOAD_S3_PATH_STYLE_ACCESS:true}
app.upload.s3.key-prefix=${APP_UPLOAD_S3_KEY_PREFIX:report-images}
app.upload.pending-image-ttl-hours=${APP_UPLOAD_PENDING_IMAGE_TTL_HOURS:24}
app.upload.pending-image-cleanup-cron=${APP_UPLOAD_PENDING_IMAGE_CLEANUP_CRON:0 0 3 * * *}
app.binding.default-password-length=${APP_BINDING_DEFAULT_PASSWORD_LENGTH:12}

spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:90MB}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
