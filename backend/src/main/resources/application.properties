server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3308/heihu_workorder?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

app.seed.factory-code=HHGD
app.seed.factory-name=\u9ED1\u6E56\u5C0F\u5DE5\u5355\u6D4B\u8BD5\u5DE5\u5382
app.seed.admin-username=admin
app.seed.admin-password=123456
app.seed.admin-name=\u738B\u827A\u5112

app.wechat.mock-enabled=true
app.wechat.app-id=
app.wechat.secret=
app.upload.report-image-dir=uploads/report-images
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=90MB
# 绑定成功后生成的默认密码长度
app.binding.default-password-length=6
