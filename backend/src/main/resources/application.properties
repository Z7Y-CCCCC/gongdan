server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3308/heihu_workorder?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration

app.seed.factory-code=${APP_SEED_FACTORY_CODE:HHGD}
app.seed.factory-name=${APP_SEED_FACTORY_NAME:\u9ED1\u6E56\u5C0F\u5DE5\u5355\u6D4B\u8BD5\u5DE5\u5382}
app.seed.admin-username=${APP_SEED_ADMIN_USERNAME:admin}
app.seed.admin-password=${APP_SEED_ADMIN_PASSWORD:local-admin-pass}
app.seed.admin-name=${APP_SEED_ADMIN_NAME:\u738B\u827A\u5112}
app.seed.super-admin-factory-code=${APP_SEED_SUPER_ADMIN_FACTORY_CODE:ADMIN}
app.seed.super-admin-factory-name=${APP_SEED_SUPER_ADMIN_FACTORY_NAME:\u8D85\u7EA7\u7BA1\u7406\u5458}
app.seed.super-admin-username=${APP_SEED_SUPER_ADMIN_USERNAME:admin}
app.seed.super-admin-password=${APP_SEED_SUPER_ADMIN_PASSWORD:local-super-admin-pass}
app.seed.super-admin-name=${APP_SEED_SUPER_ADMIN_NAME:\u8D85\u7EA7\u7BA1\u7406\u5458}

app.wechat.mock-enabled=${APP_WECHAT_MOCK_ENABLED:true}
app.wechat.app-id=${APP_WECHAT_APP_ID:}
app.wechat.secret=${APP_WECHAT_SECRET:}
app.wechat.openid-ticket-ttl-minutes=${APP_WECHAT_OPENID_TICKET_TTL_MINUTES:10}
app.sms.sender=${APP_SMS_SENDER:log}
app.sms.log-code=${APP_SMS_LOG_CODE:true}
app.sms.http.url=${APP_SMS_HTTP_URL:}
app.sms.http.auth-header-name=${APP_SMS_HTTP_AUTH_HEADER_NAME:}
app.sms.http.auth-header-value=${APP_SMS_HTTP_AUTH_HEADER_VALUE:}
app.sms.http.template=${APP_SMS_HTTP_TEMPLATE:login_code}
app.sms.http.connect-timeout-ms=${APP_SMS_HTTP_CONNECT_TIMEOUT_MS:3000}
app.sms.http.read-timeout-ms=${APP_SMS_HTTP_READ_TIMEOUT_MS:5000}
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,http://192.168.*:*,http://10.*:*,http://172.*:*}
app.session.ttl-minutes=${APP_SESSION_TTL_MINUTES:720}
app.upload.report-image-dir=${APP_UPLOAD_REPORT_IMAGE_DIR:uploads/report-images}
app.upload.pending-image-ttl-hours=${APP_UPLOAD_PENDING_IMAGE_TTL_HOURS:24}
app.upload.pending-image-cleanup-cron=${APP_UPLOAD_PENDING_IMAGE_CLEANUP_CRON:0 0 3 * * *}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=90MB
# 绑定成功后生成的默认密码长度
app.binding.default-password-length=${APP_BINDING_DEFAULT_PASSWORD_LENGTH:6}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
