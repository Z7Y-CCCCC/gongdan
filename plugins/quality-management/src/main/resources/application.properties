server.port=${SERVER_PORT:9101}
server.error.include-message=always
plugin.gateway.secret=${PLUGIN_GATEWAY_SECRET:}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

spring.jackson.serialization.write-dates-as-timestamps=false

# Each standalone plugin owns its durable database. Never fall back to memory.
spring.datasource.url=jdbc:h2:file:${PLUGIN_DATA_DIR:./data}/quality-management;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0
spring.datasource.username=sa
spring.datasource.password=${PLUGIN_DATABASE_PASSWORD:}
spring.sql.init.mode=always
