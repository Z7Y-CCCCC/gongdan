<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>质量管理插件</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, "Microsoft YaHei", sans-serif; background: #101318; color: #e6edf7; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #101318; }
    main { padding: 26px; max-width: 980px; margin: 0 auto; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 20px; border-bottom: 1px solid #28303b; padding-bottom: 18px; }
    h1 { margin: 0; font-size: 22px; font-weight: 650; }
    .muted { color: #8995a7; font-size: 13px; }
    .health { display: inline-flex; align-items: center; gap: 8px; color: #80e0b1; font-size: 13px; }
    .health::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #32c889; box-shadow: 0 0 0 4px rgba(50,200,137,.12); }
    .health.down { color: #ff9d9d; }
    .health.down::before { background: #ff5f56; box-shadow: 0 0 0 4px rgba(255,95,86,.12); }
    .grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; margin-top: 22px; }
    section { border: 1px solid #28303b; background: #151a21; border-radius: 8px; padding: 18px; }
    h2 { margin: 0 0 14px; font-size: 15px; }
    .record { padding: 13px 0; border-top: 1px solid #28303b; }
    .record:first-child { border-top: 0; }
    .record-title { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
    .tag { color: #91c8ff; font-size: 12px; background: rgba(34,130,230,.16); padding: 3px 8px; border-radius: 12px; }
    form { display: grid; gap: 10px; }
    label { display: grid; gap: 6px; color: #aab5c5; font-size: 12px; }
    input, textarea, select { width: 100%; color: #e6edf7; background: #101318; border: 1px solid #344050; border-radius: 5px; padding: 9px 10px; font: inherit; }
    textarea { min-height: 90px; resize: vertical; }
    button { cursor: pointer; border: 0; border-radius: 5px; background: #1677e8; color: white; padding: 9px 14px; font-weight: 600; }
    button:disabled { opacity: .55; cursor: wait; }
    .notice { margin: 0 0 18px; padding: 11px 13px; border: 1px solid #4e3e25; background: #2b2419; color: #f0c77a; border-radius: 6px; font-size: 13px; }
    @media (max-width: 760px) { main { padding: 18px; } .grid { grid-template-columns: 1fr; } header { align-items: flex-start; flex-direction: column; } }
  </style>
</head>
<body>
<main>
  <header>
    <div><h1>质量管理</h1><div class="muted">独立插件示例 · 版本 1.0.0</div></div>
    <div id="health" class="health down">等待平台连接</div>
  </header>
  <div id="notice" class="notice">正在等待主系统建立安全消息桥。</div>
  <div class="grid">
    <section><h2>质量问题记录</h2><div id="records"><div class="muted">暂无数据</div></div></section>
    <section>
      <h2>新增问题</h2>
      <form id="form">
        <label>问题描述<input name="issue" required maxlength="200" placeholder="例如：首件尺寸偏差"></label>
        <label>状态<select name="status"><option>待处理</option><option>处理中</option><option>已关闭</option></select></label>
        <label>备注<textarea name="remark" maxlength="500" placeholder="补充处理说明"></textarea></label>
        <button id="submit" type="submit" disabled>等待平台连接</button>
      </form>
    </section>
  </div>
</main>
<script>
  const pluginKey = 'quality-management';
  const pending = new Map();
  let parentOrigin = '';
  let requestSequence = 0;
  const $ = (id) => document.getElementById(id);

  function setNotice(message, isError) {
    $('notice').textContent = message;
    $('notice').style.borderColor = isError ? '#5a3030' : '#4e3e25';
    $('notice').style.color = isError ? '#ff9d9d' : '#f0c77a';
  }

  function request(path, options) {
    if (!parentOrigin) return Promise.reject(new Error('平台连接尚未建立'));
    const requestId = pluginKey + '-' + Date.now() + '-' + (++requestSequence);
    return new Promise((resolve, reject) => {
      const timeout = window.setTimeout(() => {
        pending.delete(requestId);
        reject(new Error('插件请求超时'));
      }, 8000);
      pending.set(requestId, { resolve, reject, timeout });
      window.parent.postMessage({
        type: 'plugin-api-request',
        pluginKey,
        requestId,
        path,
        method: (options && options.method) || 'GET',
        body: (options && options.body) || null
      }, parentOrigin);
    });
  }

  async function loadRecords() {
    const items = await request('/api/plugin/quality-management/records');
    $('records').innerHTML = items.length ? items.map(item =>
      '<div class="record"><div class="record-title"><strong>' + escapeHtml(item.issue) + '</strong><span class="tag">' + escapeHtml(item.status) + '</span></div>' +
      '<div class="muted">' + escapeHtml(item.remark || '无备注') + ' · ' + escapeHtml(item.createdAt) + '</div></div>'
    ).join('') : '<div class="muted">暂无数据</div>';
  }

  async function connect() {
    try {
      const ping = await request('/api/plugin/quality-management/ping');
      $('health').textContent = '服务正常 · ' + ping.version;
      $('health').className = 'health';
      $('submit').disabled = false;
      $('submit').textContent = '保存问题';
      setNotice('插件已通过主系统安全代理连接。', false);
      await loadRecords();
    } catch (error) {
      $('health').textContent = '服务不可用';
      $('health').className = 'health down';
      setNotice(error.message, true);
    }
  }

  function escapeHtml(value) { return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }

  window.addEventListener('message', (event) => {
    const data = event.data || {};
    if (data.pluginKey !== pluginKey) return;
    if (data.type === 'platform-context') {
      parentOrigin = event.origin;
      document.documentElement.style.colorScheme = data.theme === 'dark' ? 'dark' : 'light';
      connect();
      return;
    }
    if (data.type !== 'plugin-api-response' || event.origin !== parentOrigin) return;
    const item = pending.get(data.requestId);
    if (!item) return;
    pending.delete(data.requestId);
    clearTimeout(item.timeout);
    if (data.ok) item.resolve(data.body);
    else item.reject(new Error((data.body && data.body.message) || '插件请求失败'));
  });

  $('form').addEventListener('submit', async (event) => {
    event.preventDefault();
    const button = $('submit');
    button.disabled = true;
    try {
      const data = Object.fromEntries(new FormData(event.target).entries());
      await request('/api/plugin/quality-management/records', { method: 'POST', body: data });
      event.target.reset();
      await loadRecords();
      setNotice('质量问题已保存。', false);
    } catch (error) { setNotice(error.message, true); }
    button.disabled = false;
  });

  window.parent.postMessage({ type: 'plugin-ready', pluginKey }, '*');
</script>
</body>
</html>
