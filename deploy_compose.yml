# LEGACY LOCAL DEMO ONLY. Not the production docker-compose.yml.
# Contains public example credentials, log-only SMS and privileged demo tools.
# Do not expose it via public interfaces, a tunnel or an Internet reverse proxy.
# For production use the maintained docker-compose.yml, prod profile and preflight.
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: heihu_workorder
      MYSQL_USER: heihu_app
      MYSQL_PASSWORD: HeihuPassword@2026
      MYSQL_ROOT_PASSWORD: RootPassword@2026
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: [ CMD-SHELL, mysqladmin ping -h 127.0.0.1 -uheihu_app -pHeihuPassword@2026 --silent]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redis123
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD-SHELL, redis-cli -a redis123 ping]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: eclipse-temurin:8-jre
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    working_dir: /app
    environment:
      SPRING_PROFILES_ACTIVE: default
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/heihu_workorder?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: heihu_app
      SPRING_DATASOURCE_PASSWORD: HeihuPassword@2026
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: redis123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      APP_SEED_FACTORY_CODE: HHGD
      APP_SEED_FACTORY_NAME: 黑湖小工单测试工厂
      APP_SEED_ADMIN_USERNAME: admin
      APP_SEED_ADMIN_PASSWORD: Demo@123456
      APP_SEED_ADMIN_NAME: 系统管理员
      APP_SMS_SENDER: log
      APP_SMS_LOG_CODE: true
    volumes:
      - ./workorder-1.0.0.jar:/app/app.jar:ro
      - report-images:/var/lib/heihu-workorder/report-images
    command: [java, -Xmx512m, -Xms256m, -jar, /app/app.jar]

  monitor:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/amir20/dozzle:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DOZZLE_BASE: /ops
      DOZZLE_NO_ANALYTICS: true

  terminal:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/tsl0922/ttyd:alpine
    restart: unless-stopped
    command: ttyd -b /terminal -c admin:Demo@123456 sh

  files:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/filebrowser/filebrowser:latest
    restart: unless-stopped
    environment:
      FB_BASEURL: /files
    volumes:
      - /home/ubuntu:/srv
      - ./filebrowser_data/database.db:/database.db

  uptime:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/louislam/uptime-kuma:1
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./uptime_kuma_data:/app/data

  speedtest:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/adolfintel/speedtest:latest
    restart: unless-stopped

  frontend:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - monitor
      - terminal
      - files
      - uptime
      - speedtest
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  db-data:
  redis-data:
  report-images:
